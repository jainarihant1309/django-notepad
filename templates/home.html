<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django Notepad</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <h1 class="text-center mb-4">
        📝 Django Notepad
    </h1>

    <div class="card shadow mb-4">

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">
                        Title
                    </label>

                    <input
                        type="text"
                        name="title"
                        class="form-control"
                        placeholder="Enter Note Title"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Content
                    </label>

                    <textarea
                        class="form-control"
                        name="content"
                        rows="5"
                        placeholder="Write your note here..."
                        required></textarea>

                </div>

                <button class="btn btn-primary w-100">
                    Save Note
                </button>

            </form>

        </div>

    </div>

    <h3 class="mb-3">
        Your Notes
    </h3>

    {% for note in notes %}

    <div class="card shadow-sm mb-3">

        <div class="card-body">

            <h4>{{ note.title }}</h4>

            <p>{{ note.content }}</p>

            <p class="text-muted mb-3">

                Created :
                {{ note.created_at }}

            </p>

            <a
                href="{% url 'edit_note' note.id %}"
                class="btn btn-warning btn-sm">

                Edit

            </a>

            <a
                href="{% url 'delete_note' note.id %}"
                class="btn btn-danger btn-sm">

                Delete

            </a>

        </div>

    </div>

    {% empty %}

    <div class="alert alert-info">

        No Notes Available

    </div>

    {% endfor %}

</div>

</body>

</html>
