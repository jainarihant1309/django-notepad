<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Note</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<div class="card shadow">

<div class="card-body">

<h2 class="mb-4">

Edit Note

</h2>

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<input
type="text"
name="title"
class="form-control"
value="{{ note.title }}"
required>

</div>

<div class="mb-3">

<textarea
name="content"
rows="6"
class="form-control"
required>{{ note.content }}</textarea>

</div>

<button class="btn btn-success">

Update Note

</button>

<a href="/"
class="btn btn-secondary">

Cancel

</a>

</form>

</div>

</div>

</div>

</body>

</html>
